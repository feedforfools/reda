[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reda"
version = "0.1.0"
description = "Local PII redaction validation workbench for Italian documents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "transformers>=4.40,<5",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.1",
    "pytest-cov>=5.0",
]
gliner = [
    "gliner>=0.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["models", "exceptions", "ner_layer", "regex_layer", "pipeline", "redact", "span_utils", "gliner_layer"]
